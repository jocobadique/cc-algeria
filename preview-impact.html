<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impact preview</title>
  <style>
    /* Like the Events page: a native heading, then the element in the same light mint section. */
    body { margin: 0; background: #e6f8f5; font-family: Poppins, system-ui, sans-serif; color: #003c40; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
    .impact { padding: 88px 0; }
    .impact h2 { max-width: 760px; margin: 0 auto 52px; text-align: center; font: 500 clamp(1.9rem, 3.4vw, 2.9rem)/1.12 Fraunces, Georgia, serif; }
  </style>
</head>
<body>
  <section class="impact">
    <div class="wrap">
      <h2>Impact</h2>
      <cc-impact id="impact"></cc-impact>
    </div>
  </section>
  <script src="dist/cc-impact.js"></script>
  <script>
    // Stand-in for the Wix page code: load the CMS export and pass it in like
    // $w("#customElement2").setAttribute("impact", JSON.stringify(items)).
    fetch("sample-impact.json")
      .then((r) => r.json())
      .then((items) => document.getElementById("impact").setAttribute("impact", JSON.stringify(items)));
  </script>
</body>
</html>
