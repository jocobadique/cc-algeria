<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos preview</title>
  <style>
    /* Like the homepage: a native heading, then the element in the same light mint section. */
    body { margin: 0; background: #e6f8f5; font-family: Poppins, system-ui, sans-serif; color: #003c40; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
    .videos { padding: 88px 0; }
    .videos h2 { max-width: 760px; margin: 0 auto 52px; text-align: center; font: 500 clamp(1.9rem, 3.4vw, 2.9rem)/1.12 Fraunces, Georgia, serif; }
  </style>
</head>
<body>
  <section class="videos">
    <div class="wrap">
      <h2>Educational Videos on Classics, Languages &amp; Global Voices</h2>
      <cc-videos id="videos"></cc-videos>
    </div>
  </section>
  <script src="dist/cc-videos.js"></script>
  <script>
    // Stand-in for the Wix page code: load the CMS export and pass it in like
    // $w('#customElement2').setAttribute('videos', JSON.stringify(items)).
    fetch("sample-videos.json")
      .then((r) => r.json())
      .then((items) => document.getElementById("videos").setAttribute("videos", JSON.stringify(items)));
  </script>
</body>
</html>
