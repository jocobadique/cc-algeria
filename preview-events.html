<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events preview</title>
  <style>
    body { margin: 0; background: #f7fdfd; }
    main { max-width: 1240px; margin: 0 auto; padding: 64px 24px; }
  </style>
</head>
<body>
  <main>
    <cc-events id="events"></cc-events>
  </main>
  <script src="dist/cc-events.js"></script>
  <script>
    // Stand-in for the Wix page code: load the CMS exports, attach each
    // program's sessions and pass them in like
    // $w('#customElement1').setAttribute('events', JSON.stringify(items)).
    Promise.all(["sample-events.json", "sample-sessions.json"].map((f) => fetch(f).then((r) => r.json()))).then(
      ([items, sessions]) => {
        items = items.map((e) => ({ ...e, sessions: sessions.filter((s) => s.program === e._id) }));
        document.getElementById("events").setAttribute("events", JSON.stringify(items));
      },
    );
  </script>
</body>
</html>
