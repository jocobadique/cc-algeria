<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events preview</title>
  <style>
    /* Like the Wix page: a mint header section, then the element first in its own section. */
    body { margin: 0; background: #f7fdfd; font-family: Poppins, system-ui, sans-serif; color: #003c40; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
    .hero { background: #d9f5f2; padding: 72px 0 8px; }
    .hero p:first-child { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #006a68; }
    .hero h1 { margin: 0; font: 700 clamp(2.6rem, 6vw, 4rem)/1.05 Fraunces, Georgia, serif; }
    .hero p { max-width: 640px; line-height: 1.6; }
    .cards { padding: 40px 0 80px; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="wrap">
      <p>Classic Compass</p>
      <h1>Events</h1>
      <p>We believe in the enduring value of Classics and Languages, and we're here to guide you on an enriching educational journey that intertwines history, language, and culture.</p>
    </div>
  </section>
  <section class="cards">
    <div class="wrap">
      <cc-events id="events" band="#d9f5f2"></cc-events>
    </div>
  </section>
  <script src="dist/cc-events.js"></script>
  <script>
    // Stand-in for the Wix page code: load the CMS exports, attach each
    // program's sessions and pass them in like
    // $w('#customElement1').setAttribute('events', JSON.stringify(items)).
    Promise.all(["sample-events.json", "sample-sessions.json"].map((f) => fetch(f).then((r) => r.json()))).then(
      ([items, sessions]) => {
        items = items.map((e) => ({ ...e, sessions: sessions.filter((s) => s.program === e._id) }));
        document.getElementById("events").setAttribute("events", JSON.stringify(items));
      },
    );
  </script>
</body>
</html>
