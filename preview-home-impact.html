<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homepage impact preview</title>
  <style>
    /* Like the homepage hero: light background, native eyebrow, H1 and text, then the element. */
    body { margin: 0; background: #ffffff; font-family: Poppins, system-ui, sans-serif; color: #08201f; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
    .hero { background: linear-gradient(120deg, #e8f8f6 0%, #d5f3f0 55%, #b9e6e0 100%); padding: 80px 0 72px; }
    .hero p.eyebrow { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #007a72; }
    .hero h1 { max-width: 640px; margin: 0; font: 700 clamp(2rem, 4.4vw, 2.9rem)/1.15 Fraunces, Georgia, serif; }
    .hero p.lede { max-width: 560px; margin: 18px 0 40px; line-height: 1.6; color: #1f3a3c; }
    .after { padding: 80px 0; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">Welcome to Classic Compass</p>
      <h1>An initiative around using Latin as tool for the modern world and we hope to expand that impact through education.</h1>
      <p class="lede">At Classic Compass we believe that the maintenance of Latin is as important as the maintenance of spoken languages.</p>
      <cc-impact id="impact" layout="highlights" link="/impact"></cc-impact>
    </div>
  </section>
  <section class="after"><div class="wrap"><p>Next section</p></div></section>
  <script src="dist/cc-impact.js"></script>
  <script>
    // Stand-in for wix/home.page.js: $w("#customElement3").setAttribute("impact", JSON.stringify(items)).
    fetch("sample-impact.json").then((r) => r.json()).then((items) => {
      document.getElementById("impact").setAttribute("impact", JSON.stringify(items));
    });
  </script>
</body>
</html>
